[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nordtrace"
version = "1.0.0"
description = "Norwegian company intelligence agent with evidence-backed research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PrathamKapoor", email = "prathamkapoor027@gmail.com"}]
keywords = ["norway", "company", "research", "intelligence", "brreg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pypdf>=4.0",
    "pdfminer.six>=20221105",
    "sqlite-utils>=3.35",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "click>=8.1",
    "python-dotenv>=1.0",
    "structlog>=23.2",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "aiofiles>=23.2",
    "python-multipart>=0.0",
    "jinja2>=3.1",
    "rich>=13.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.9",
    "ruff>=0.1.4",
    "mypy>=1.6",
    "types-requests",
    "types-pyyaml",
    "httpx>=0.25",
]
frontend = ["fastapi>=0.100", "jinja2>=3.1", "starlette>=0.27"]

[project.scripts]
nordtrace = "nordtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
