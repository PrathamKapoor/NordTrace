services:
  nordtrace:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./cache:/app/cache
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app/src
      - DATA_DIR=/app/data
    command: uvicorn nordtrace.api.app:app --host 0.0.0.0 --port 8000
